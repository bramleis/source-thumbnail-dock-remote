plugins { id 'com.android.application' }

android {
    namespace 'id.kominfo.sorong.sourcethumbnailremote'
    compileSdk 35
    defaultConfig {
        applicationId 'id.kominfo.sorong.sourcethumbnailremote'
        minSdk 24
        targetSdk 35
        versionCode 2
        versionName '1.0.1'
    }
}

dependencies {
    implementation 'org.java-websocket:Java-WebSocket:1.5.7'
    implementation 'com.google.code.gson:gson:2.11.0'
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
}
